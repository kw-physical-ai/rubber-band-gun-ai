name: Deploy evaluation release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.PI_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pi-evaluation
    concurrency:
      group: pi-evaluation-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          lfs: true
      - name: Resolve checked-out release
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify release
        run: |
          python -m pip install -e '.[dev]'
          python scripts/verify-pre-device.py
          git lfs fsck
      - name: Connect runner to Tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.PI_HOST }}
      - name: Configure deploy SSH key
        env:
          PI_DEPLOY_SSH_KEY: ${{ secrets.PI_DEPLOY_SSH_KEY }}
          PI_SSH_KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PI_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Synchronize evaluation release
        env:
          PI_HOST: ${{ vars.PI_HOST }}
          PI_USER: ${{ vars.PI_USER }}
          PI_RELEASE_ROOT: ${{ vars.PI_RELEASE_ROOT }}
        run: scripts/deploy-eval.sh "$PI_USER@$PI_HOST" "$PI_RELEASE_ROOT" "${{ steps.release.outputs.sha }}"
