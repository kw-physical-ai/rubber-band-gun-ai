[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rubber-band-gun-ai"
version = "0.1.0"
description = "Reproducible Colab and Raspberry Pi evaluation workflow for the Physical AI course project"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["physical-ai"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
